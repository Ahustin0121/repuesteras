<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Definición de estilos y gradientes -->
  <defs>
    <linearGradient id="gradienteMecanico" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradienteDetalle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f12711;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5af19;stop-opacity:1" />
    </linearGradient>
  </defs>

  {/* Icono: Isotipo de Repuesteras (Engranaje + Precisión) */}
  <g transform="translate(10, 10)">
    <!-- Círculo externo del engranaje -->
    <circle cx="50" cy="50" r="38" fill="url(#gradienteMecanico)" />
    
    <!-- Dientes del engranaje (Estilo Tech/Pixeleado) -->
    <path d="M 45 2 L 55 2 L 57 15 L 43 15 Z" fill="url(#gradienteMecanico)" />
    <path d="M 45 98 L 55 98 L 57 85 L 43 85 Z" fill="url(#gradienteMecanico)" />
    <path d="M 2 45 L 2 55 L 15 57 L 15 43 Z" fill="url(#gradienteMecanico)" />
    <path d="M 98 45 L 98 55 L 85 57 L 85 43 Z" fill="url(#gradienteMecanico)" />
    
    <!-- Centro del engranaje cortado (Efecto mecánico) -->
    <circle cx="50" cy="50" r="20" fill="#ffffff" />
    
    <!-- Líneas de código/precisión en el centro -->
    <line x1="38" y1="50" x2="62" y2="50" stroke="url(#gradienteDetalle)" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="38" x2="50" y2="62" stroke="url(#gradienteDetalle)" stroke-width="4" stroke-linecap="round" />
  </g>

  {/* Texto Principal: REPUESTERAS */}
  <text x="130" y="65" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="42" font-weight="900" fill="#1e3c72" letter-spacing="2">
    REPUESTERAS
  </text>

  {/* Línea divisoria de diseño */}
  <rect x="130" y="75" width="340" height="4" rx="2" fill="url(#gradienteDetalle)" />

  {/* Eslogan inferior */}
  <text x="135" y="98" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#6c757d" letter-spacing="4">
    CONEXIÓN AUTOMOTRIZ
  </text>
</svg>
